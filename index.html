<style>
:root{--bg:#101B26;--sf:#1B2B37;--ink:#F4F7F9;--mu:#A7B7C1;--ln:#2b3e4d;--ac:#B8F56D;--on:#0b0f14;--gd:#F9B958;--tk:#38f28b;--tkon:#06210f;--bf:'Inter';--hf:'Inter';--tt:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--bf),system-ui,sans-serif;min-height:100vh}
button{font-family:inherit}
main{max-width:480px;margin:0 auto;padding:20px 18px 130px}
h1,h2,.hf{font-family:var(--hf),system-ui,sans-serif;text-transform:var(--tt);margin:0}
h1{font-size:30px;line-height:1.1}h2{font-size:18px;margin:26px 0 10px}
.mu{color:var(--mu);font-size:13px}.xp{color:var(--gd);font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:10px}
.ringc{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:120px;height:120px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}.ring .t{stroke:var(--ln)}
.ring .p{stroke:var(--ac);transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 28px var(--hf)}
.r{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.2s}
.r.on .nm,.r.on .ic,.r.on .num{opacity:.5}.r.on .ck{box-shadow:0 0 0 4px color-mix(in srgb,var(--tk) 30%,transparent),0 0 14px color-mix(in srgb,var(--tk) 55%,transparent)}.wk .p{background:var(--tk);border-color:var(--tk)}.r:not(.on){border-color:color-mix(in srgb,var(--ac) 45%,var(--ln))}.r:not(.on) .nm{font-weight:600}
.ck{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;color:var(--on);font-size:18px;font-weight:700;transition:.2s}
.r.on .ck{background:var(--tk);border-color:var(--tk);color:var(--tkon);font-size:20px;transform:scale(1.1)}
.ic{font-size:22px}.nm{flex:1;min-width:0;overflow-wrap:break-word;hyphens:auto;font-weight:500}
.sm{background:none;border:1px solid var(--ln);color:var(--ink);border-radius:10px;min-width:38px;height:38px;font-size:16px;cursor:pointer}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:30px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--mu);font:600 12px var(--bf);padding:6px;cursor:pointer;display:grid;gap:2px;justify-items:center}nav button span{font-size:20px}nav button.on{color:var(--ac)}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:13px 18px;font:700 15px var(--bf);cursor:pointer}.btn.g{background:none;color:var(--ink);border:1px solid var(--ln)}.btn.d{background:none;color:#ff6b6b;border:1px solid var(--ln)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:6px 0 12px}
.l{font-size:13px;color:var(--mu)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--sf);color:var(--ink);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.chip{border:1px solid var(--ln);background:none;color:var(--ink);border-radius:999px;min-width:40px;height:40px;padding:0 12px;cursor:pointer;font-size:16px}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal button,.cal span{aspect-ratio:1;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--ink);font-size:13px;display:grid;place-items:center;padding:0}

.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{margin:0}.st b{display:block;font:700 26px var(--hf)}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.hb{display:grid;grid-template-columns:1fr 90px 40px;gap:10px;align-items:center;font-size:14px;padding:6px 0}.hb em{font-style:normal;text-align:right;font-weight:700}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bgs div{text-align:center;font-size:11px;color:var(--mu);padding:10px 4px;border:1px solid var(--ln);border-radius:12px;filter:grayscale(1);opacity:.5}.bgs div.on{filter:none;opacity:1;color:var(--ink)}.bgs span{display:block;font-size:24px}
.th{display:grid;grid-template-columns:1fr 1fr;gap:8px}.th button{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--ln);color:var(--ink);border-radius:12px;padding:10px;cursor:pointer;text-align:left;font-size:14px}.th button.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.th i{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid var(--ln)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{animation:ts 2.2s ease forwards}@keyframes ts{10%,80%{opacity:1}100%{opacity:0}}
#pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);background:var(--ac);color:var(--on);font:700 22px var(--hf);text-transform:var(--tt);padding:18px 26px;border-radius:20px;opacity:0;pointer-events:none;text-align:center;z-index:30}
#pop.show{animation:pp 2.6s ease forwards}@keyframes pp{15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.num{color:var(--mu);font-weight:600;min-width:1.6em;flex:none;font-variant-numeric:tabular-nums}
.wk{display:flex;justify-content:space-between;margin-top:12px}.wk div{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--mu)}.wk i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ln)}.wk .p{background:var(--ac);border-color:var(--ac)}.wk .h{background:color-mix(in srgb,var(--ac) 40%,var(--sf));border-color:transparent}.wk .rd{border-style:dashed}.wk .f{opacity:.35}.wk .t{outline:2px solid var(--ac);outline-offset:2px}
@keyframes blk{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes ft{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .logo i,#splash .nm2 span{animation:none}}
